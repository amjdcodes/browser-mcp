<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Motion Fixture</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 16px; }
        canvas { display: block; margin: 8px 0; border: 1px solid #999; background: #fff; }
        /* CSS-sized differently from its attributes on purpose. */
        #sized-canvas { width: 300px; height: 50px; }
        #clip-target {
            width: 220px; height: 110px; background: #4a90d9; color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        #anim-box {
            width: 60px; height: 60px; background: #e04a4a; margin: 12px 0;
            animation: slide 1s linear infinite alternate;
        }
        @keyframes slide { from { transform: translateX(0); } to { transform: translateX(160px); } }
    </style>
</head>
<body>
    <h1>Console &amp; Motion Fixture</h1>

    <div id="clip-target">clip me</div>
    <div id="anim-box"></div>

    <canvas id="drawn-canvas" width="200" height="100"></canvas>
    <canvas id="blank-canvas" width="200" height="100"></canvas>
    <canvas id="sized-canvas" width="100" height="100"></canvas>

    <script>
        // One message per level so browser_get_console filtering is testable.
        console.log('motion fixture log line');
        console.info('motion fixture info line');
        console.warn('motion fixture warn line');
        console.error('motion fixture error line');
        console.debug('motion fixture debug line');

        // Uncaught exception -> Runtime.exceptionThrown (recorded as an error).
        setTimeout(function () { throw new Error('boom-uncaught-motion-fixture'); }, 500);

        // A real 2D drawing: proves canvas pixel sampling works.
        (function () {
            var ctx = document.getElementById('drawn-canvas').getContext('2d');
            ctx.fillStyle = '#0a7d5a';
            ctx.fillRect(0, 0, 200, 100);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(20, 20, 60, 60);
        })();
    </script>
</body>
</html>
